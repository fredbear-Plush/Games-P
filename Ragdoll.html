<html><head><base target="_blank"></head><body><center>
<button onclick="openGame()" style="background-color: #000000; color: #fff; border: 1; border-color: #FFFFFF; vertical-align: center; font-size: 26px; width:100%; cursor: pointer; border-radius: 10px;"> RAgdoll </button>
<script>
function openGame() {
        var win = window.open ()
        var url = "https://freetoplayz.github.io/ragdoll-hit/"
        var iframe = win.document.createElement('iframe')
        iframe.style.width = "100%"
        iframe.style.height = "100%"
        iframe.style.border = "none"
        iframe.src = url
        win.document.body.appendChild(iframe)
}
</script>
</center></body></html>
